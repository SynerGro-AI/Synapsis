name: Deploy to Cloudflare (synapsis.school)

# Deploys on every push to main (Cloudflare Workers + static assets have no
# native Git build integration, so publishing must run `wrangler deploy` here),
# and can still be run manually from the Actions tab. Requires the
# CLOUDFLARE_API_TOKEN repository secret (Cloudflare dashboard -> My Profile ->
# API Tokens -> Create Token -> "Edit Cloudflare Workers" template).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
